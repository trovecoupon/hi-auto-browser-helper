<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Cấu hình Hi Auto Coupon Harvester</title><link rel="stylesheet" href="options.css"></head>
<body><main>
  <header><img src="../assets/icon-128.png" alt=""><div><h1>Hi Auto Coupon Harvester</h1><p>Toàn bộ dữ liệu được giữ trong Chrome trên máy này.</p></div></header>
  <section><h2>Lớp phát hiện</h2><div class="grid" data-settings></div><label>Luôn cho phép (mỗi dòng một mã)<textarea data-allow rows="4"></textarea></label><label>Chặn thêm (mỗi dòng một mã)<textarea data-block rows="4"></textarea></label><label>Override theo domain (JSON)<textarea data-domain rows="6" spellcheck="false"></textarea></label><button data-save>Lưu cấu hình</button><span data-message></span></section>
  <section><h2>Rule đã học</h2><div data-rules></div></section>
  <section><h2>Dữ liệu local</h2><p><b data-count>0</b> mã đã thu thập.</p><button class="danger" data-clear>Xóa toàn bộ mã đã bắt</button></section>
</main><script type="module" src="options.js"></script></body></html>
